# Production stack for mocker.sapper.top — fully self-contained, no PaaS layer.
#
# Caddy is the only internet-facing container: it owns 80/443, terminates TLS with automatic
# Let's Encrypt issuance/renewal, and proxies everything to the frontend. Nothing else publishes
# a port, so Postgres and the backend are unreachable from outside the compose networks.
#
# Both app images are PULLED from GHCR (built by CI on every push to main). Never build on the
# VPS: `next build` peaks at ~1.6 GB, mem_limit does not constrain a build, and the OOM killer
# picks its own victims.
name: mocker

networks:
  edge:
    driver: bridge          # Caddy <-> frontend <-> backend
  internal:
    driver: bridge          # Postgres lives here alone

volumes:
  pgdata:
    # Explicitly named. Without this the volume is derived as <project>_pgdata, which collides
    # with the development stack's volume of the same name: production Postgres then attaches to
    # the dev database and rejects its own password, because POSTGRES_PASSWORD only applies at
    # first init.
    name: mocker-prod-pgdata
  caddy-data:
    name: mocker-caddy-data # TLS certificates + ACME account — keep across redeploys

services:
  mocker-caddy:
    image: caddy:2-alpine
    container_name: mocker-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    networks: [edge]
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      DOMAIN: ${DOMAIN:-mocker.sapper.top}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env — Let's Encrypt requires a contact address}
    depends_on:
      mocker-frontend: { condition: service_healthy }
    mem_limit: 128m
    memswap_limit: 128m
    cpus: 0.5

  mocker-frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/aravindshajan6/mocker-frontend:latest}
    container_name: mocker-frontend
    restart: unless-stopped
    networks: [edge]
    environment:
      # Informational only: the rewrite destination is baked at build time (see Dockerfile.prod).
      BACKEND_URL: http://mocker-backend:8000
      # Node sizes its heap from HOST memory, not the cgroup, so without this it grows past
      # mem_limit and the kernel kills the container instead of Node collecting garbage.
      NODE_OPTIONS: --max-old-space-size=192
    depends_on:
      mocker-backend: { condition: service_healthy }
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0
    # No compose healthcheck on purpose: a compose healthcheck OVERRIDES the image's, and letting
    # them drift once left the container permanently unhealthy. The Dockerfile's HEALTHCHECK is
    # the single definition.

  mocker-backend:
    image: ${BACKEND_IMAGE:-ghcr.io/aravindshajan6/mocker-backend:latest}
    container_name: mocker-backend      # this exact name is what the frontend image was built against
    restart: unless-stopped
    # On `edge` so the frontend can reach it, and on `internal` to reach Postgres. Caddy has no
    # route to it, so it is never internet-facing.
    networks: [edge, internal]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+asyncpg://mocker:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@mocker-postgres:5432/mocker
      DATA_DIR: /app/data/questions
      # Chain: Caddy -> Next rewrite -> uvicorn. Caddy discards a client-supplied X-Forwarded-For
      # (the client is not a trusted proxy) and writes exactly one entry — the real peer — and
      # Next's rewrite passes the header through without appending. So one hop. Verify after the
      # first deploy (a rate-limit hit logs the peer IP) and re-measure if any proxy is added.
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      HSTS_ENABLED: "true"
      COOKIE_SECURE: "true"
      CORS_ORIGINS: https://${DOMAIN:-mocker.sapper.top}
      PUBLIC_BASE_URL: https://${DOMAIN:-mocker.sapper.top}
      # TESTING_HOOKS is deliberately unset here; the reset endpoint must not exist in production.
    depends_on:
      mocker-postgres: { condition: service_healthy }
    mem_limit: 448m
    memswap_limit: 448m
    cpus: 1.0

  mocker-postgres:
    image: postgres:16-alpine
    container_name: mocker-postgres     # referenced by THIS name in DATABASE_URL
    restart: unless-stopped
    networks: [internal]                # deliberately NOT on edge
    environment:
      POSTGRES_USER: mocker
      POSTGRES_DB: mocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Postgres sizes nothing from the container limit on its own; these are explicit so it cannot
    # plan its way past mem_limit.
    command: >
      postgres -c shared_buffers=64MB -c max_connections=40
               -c effective_cache_size=192MB -c work_mem=4MB
               -c maintenance_work_mem=32MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocker -d mocker"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 256m
    memswap_limit: 256m
