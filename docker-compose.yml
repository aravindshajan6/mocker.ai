services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mocker}
      POSTGRES_DB: mocker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocker -d mocker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mocker:${POSTGRES_PASSWORD:-mocker}@db:5432/mocker
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATA_DIR: /app/data/questions
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CORS_ORIGINS: http://localhost:3001
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@mocker.app}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
