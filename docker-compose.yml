services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mocker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mocker}
      POSTGRES_DB: mocker
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mocker -d mocker"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://mocker:${POSTGRES_PASSWORD:-mocker}@db:5432/mocker
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATA_DIR: /app/data/questions
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-groq}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      CURRENT_AFFAIRS_ENABLED: ${CURRENT_AFFAIRS_ENABLED:-true}
      CURRENT_AFFAIRS_HOUR_IST: ${CURRENT_AFFAIRS_HOUR_IST:-6}
      CURRENT_AFFAIRS_TARGET: ${CURRENT_AFFAIRS_TARGET:-15}
      VERIFY_ENABLED: ${VERIFY_ENABLED:-true}
      VERIFY_HOUR_IST: ${VERIFY_HOUR_IST:-3}
      VERIFY_PER_NIGHT: ${VERIFY_PER_NIGHT:-400}
      VERIFY_MODEL: ${VERIFY_MODEL:-qwen/qwen3.8-27b}
      REMINDERS_ENABLED: ${REMINDERS_ENABLED:-true}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3001}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:hello@mocker.local}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      CORS_ORIGINS: http://localhost:3001
      DEMO_EMAIL: ${DEMO_EMAIL:-demo@mocker.app}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-demo1234}
    volumes:
      - ./data:/app/data:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8000
    environment:
      BACKEND_URL: http://backend:8000
    ports:
      - "3001:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
