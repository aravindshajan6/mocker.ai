# Build both images and push to GHCR. The VPS only ever pulls.
#
# Why here and not on the server: `next build` peaks at 1.58 GB RSS against ~1.6 GB available on
# the box, and mem_limit does not constrain a build. A runner has 16 GB.
name: build

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required for GHCR; GITHUB_TOKEN gets it from this
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile.prod
            context: .
          - name: frontend
            dockerfile: frontend/Dockerfile.prod
            context: ./frontend
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/mocker-${{ matrix.name }}
          # `latest` for the normal path, `sha-<short>` so a rollback names a specific build.
          tags: |
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Next bakes the rewrite destination at build time, so the backend's CONTAINER name has
          # to be correct here. `backend` would resolve to a neighbour on the shared network.
          build-args: |
            BACKEND_URL=http://mocker-backend:8000
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

      - name: report image size
        run: |
          docker image pull "${{ env.REGISTRY }}/${{ github.repository_owner }}/mocker-${{ matrix.name }}:latest"
          docker image ls "${{ env.REGISTRY }}/${{ github.repository_owner }}/mocker-${{ matrix.name }}" \
            --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
